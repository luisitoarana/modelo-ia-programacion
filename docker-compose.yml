name: sistema-explicador-python-ia
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Ejecute primero iniciar_backend.bat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta configurar backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_explicador}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_LOCAL_MODEL: ${INSTALL_LOCAL_MODEL:-true}
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sistema_explicador}
      PROYECTO_ROOT: /workspace/proyectos
      APP_ENV: development
      APP_DEBUG: 'false'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8765}:8000'
    volumes:
      - ./models:/workspace/models:ro
      - proyectos:/workspace/proyectos
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8765}/api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
volumes:
  db_data:
  proyectos:
