# ════════════════════════════════════════════════════════════════════
# Fase 3 — SFT con pensamiento estructurado (CoT)
# ════════════════════════════════════════════════════════════════════
# Sobre el checkpoint de Fase 2. El modelo aprende a RAZONAR antes de
# programar: pregunta → análisis → diseño → código → explicación.
#
# Corpus: los tipos del DATASET_V2 con CoT explícito.
# Genera con: python -m ml.data.construir_dataset_v2 --escala completa
# Después filtra: jq 'select(.tipo|test("pensamiento|decision|arquitectura"))' < dataset_v2.jsonl
#
# Tiempo estimado: ~20h en Kaggle T4
# ════════════════════════════════════════════════════════════════════

fase: 3
descripcion: "SFT con CoT — pensamiento estructurado del programador"
modo: sft
seed: 44

modelo:
  preset: sota_b

modelo_base: training/checkpoints/B_fase2/checkpoint_best.pt

tokenizer: ml/tokenizer/artefactos/sp_v2_16k.model

corpus:
  jsonl: data/dataset_v2.jsonl
  filtro_tipos:
    - pensamiento_programador
    - decision_diseno
    - arquitectura_sistema
    - pensamiento_autocritico    # auto-crítica (Nivel 12 del usuario)
  val_jsonl: data/dataset_v2_val.jsonl

training:
  per_device_batch_size: 1     # SFT con seq_len 2048 consume más memoria
  grad_accum_steps: 32         # batch efectivo 32
  epocas: 3
  max_pasos: 15000             # tope de seguridad
  learning_rate: 1e-4
  min_learning_rate: 1e-5
  warmup_ratio: 0.03
  weight_decay: 0.05
  grad_clip: 1.0
  dtype: auto
  gradient_checkpointing: true
  eval_cada: 250
  eval_pasos: 50
  save_cada: 500
  log_cada: 25

salida: training/checkpoints/B_fase3
