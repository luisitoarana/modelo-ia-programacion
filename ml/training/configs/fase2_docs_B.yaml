# ════════════════════════════════════════════════════════════════════
# Fase 2 — Continued pretraining sobre documentación oficial
# ════════════════════════════════════════════════════════════════════
# Sobre el checkpoint de Fase 1. El modelo aprende a razonar:
# qué hace, por qué existe, cuándo usarlo.
#
# Corpus: docs oficiales scrapeadas (Python Docs, MDN, PEPs, PostgreSQL,
# Docker, Linux man pages, etc.). Ver ml/data/crawler_docs.py.
#
# Tiempo estimado: ~15h en Kaggle T4
# ════════════════════════════════════════════════════════════════════

fase: 2
descripcion: "Continued pretraining sobre docs oficiales — modelo B"
modo: pretrain
seed: 43

modelo:
  preset: sota_b

modelo_base: training/checkpoints/B_fase1/checkpoint_best.pt

tokenizer: ml/tokenizer/artefactos/sp_v2_16k.model

corpus:
  archivos:
    - data/docs/python_docs.txt
    - data/docs/mdn_es.txt
    - data/docs/peps.txt
    - data/docs/postgres_docs.txt
    - data/docs/docker_docs.txt
    - data/docs/fastapi_docs.txt
    - data/docs/django_docs.txt
  val_archivos:
    - data/docs/python_docs_val.txt

training:
  per_device_batch_size: 2
  grad_accum_steps: 16
  max_pasos: 25000
  learning_rate: 5e-5         # más bajo: refinamiento sobre Fase 1
  min_learning_rate: 1e-5
  warmup_ratio: 0.03
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: auto
  gradient_checkpointing: true
  eval_cada: 500
  eval_pasos: 50
  save_cada: 1000
  log_cada: 50

salida: training/checkpoints/B_fase2
