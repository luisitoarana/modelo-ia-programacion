# ════════════════════════════════════════════════════════════════════
# CONTINUED 15K → 20K — Modelo grande 88M, paso 15001 al 20000
#
# Carga checkpoint del 15K y entrena 5000 pasos más. Total: 20000.
# Estimación: ~7 horas en Kaggle T4 simple.
# Loss esperada al paso 20000: ~1.6
# EduCodeEval esperado: 32-36 / 100
# ════════════════════════════════════════════════════════════════════

fase: grande_continued_20k
descripcion: "Continued grande 88M paso 15K→20K"
modo: sft
seed: 42
device: auto

modelo:
  preset: sota_grande

modelo_base: /kaggle/working/checkpoints/grande_continued_15k/checkpoint_ultimo.pt

tokenizer: ml/tokenizer/artefactos/sp_v2_16k.model

corpus:
  jsonl: /kaggle/working/corpus_v2.jsonl

training:
  per_device_batch_size: 4
  grad_accum_steps: 4
  max_pasos: 20000
  epocas: 1
  learning_rate: 8.0e-5         # LR bajando progresivamente
  min_learning_rate: 8.0e-6
  warmup_ratio: 0.0
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: auto
  gradient_checkpointing: false
  eval_cada: 500
  save_cada: 250
  log_cada: 25

salida: /kaggle/working/checkpoints/grande_continued_20k
