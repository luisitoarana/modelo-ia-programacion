# ════════════════════════════════════════════════════════════════════
# CONTINUED 30K → 35K — Modelo grande 88M, paso 30001 al 35000
#
# Carga checkpoint del 30K y entrena 5000 pasos más. Total: 35000.
# Loss esperada: ~1.35
# EduCodeEval esperado: 40-44 / 100
# ════════════════════════════════════════════════════════════════════

fase: grande_continued_35k
descripcion: "Continued grande 88M paso 30K→35K"
modo: sft
seed: 42
device: auto

modelo:
  preset: sota_grande

modelo_base: /kaggle/working/checkpoints/grande_continued_30k/checkpoint_ultimo.pt

tokenizer: ml/tokenizer/artefactos/sp_v2_16k.model

corpus:
  jsonl: /kaggle/working/corpus_v2.jsonl

training:
  per_device_batch_size: 4
  grad_accum_steps: 4
  max_pasos: 35000
  epocas: 1
  learning_rate: 4.0e-5
  min_learning_rate: 4.0e-6
  warmup_ratio: 0.0
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: auto
  gradient_checkpointing: false
  eval_cada: 500
  save_cada: 250
  log_cada: 25

salida: /kaggle/working/checkpoints/grande_continued_35k
