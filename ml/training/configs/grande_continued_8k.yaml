# ════════════════════════════════════════════════════════════════════
# CONTINUED 5K → 8K — Modelo grande 88M, paso 5001 al 8000
#
# Version CORTA del continued para caber en sesiones con poca cuota
# restante de Kaggle (4h o menos).
#
# Tiempo estimado: ~4.5 horas (3000 pasos × 1/0.19 p/s).
# Loss esperada al paso 8000: ~2.1
# EduCodeEval esperado: 24-26 / 100
#
# Cuando se renueve la cuota (lunes proximo), continuar con
# grande_continued_10k.yaml (8K → 10K, otras 2h aprox) o saltarse
# directo a grande_continued_15k.yaml (8K → 15K, 7h).
# ════════════════════════════════════════════════════════════════════

fase: grande_continued_8k
descripcion: "Continued grande 88M paso 5K→8K (version corta para cuota baja)"
modo: sft
seed: 42
device: auto

modelo:
  preset: sota_grande

modelo_base: /kaggle/working/checkpoints/grande_sft_5k/checkpoint_ultimo.pt

tokenizer: ml/tokenizer/artefactos/sp_v2_16k.model

corpus:
  jsonl: /kaggle/working/corpus_v2.jsonl

training:
  per_device_batch_size: 4
  grad_accum_steps: 4
  max_pasos: 8000               # solo 3000 pasos extra
  epocas: 1
  learning_rate: 1.5e-4
  min_learning_rate: 1.5e-5
  warmup_ratio: 0.0
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: auto
  gradient_checkpointing: false
  eval_cada: 500
  save_cada: 250
  log_cada: 25

salida: /kaggle/working/checkpoints/grande_continued_8k
