# ════════════════════════════════════════════════════════════════════
# CONTINUED 10K → 15K — Modelo grande 88M, paso 10001 al 15000
#
# Carga checkpoint del 10K y entrena 5000 pasos más. Total: 15000.
# Estimación: ~7 horas en Kaggle T4 simple.
# Loss esperada al paso 15000: ~1.8
# EduCodeEval esperado: 28-32 / 100
# ════════════════════════════════════════════════════════════════════

fase: grande_continued_15k
descripcion: "Continued grande 88M paso 10K→15K"
modo: sft
seed: 42
device: auto

modelo:
  preset: sota_grande

modelo_base: /kaggle/working/checkpoints/grande_continued_10k/checkpoint_ultimo.pt

tokenizer: ml/tokenizer/artefactos/sp_v2_16k.model

corpus:
  jsonl: /kaggle/working/corpus_v2.jsonl

training:
  per_device_batch_size: 4
  grad_accum_steps: 4
  max_pasos: 15000
  epocas: 1
  learning_rate: 1.0e-4         # LR aún más bajo
  min_learning_rate: 1.0e-5
  warmup_ratio: 0.0
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: auto
  gradient_checkpointing: false
  eval_cada: 500
  save_cada: 250
  log_cada: 25

salida: /kaggle/working/checkpoints/grande_continued_15k
