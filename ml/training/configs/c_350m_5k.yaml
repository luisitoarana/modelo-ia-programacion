# ════════════════════════════════════════════════════════════════════
# MODELO C (350M) — Primer entrenamiento desde cero, 5000 pasos.
#
# Este es el MODELO ESTRELLA del proyecto: 350 millones de parametros,
# el mas grande y capaz. Se entrena en Lightning AI (estable, no se
# reinicia como Kaggle).
#
# Se entrena por escalones: 5K -> 10K -> 20K -> 30K... usando continued
# pretraining (cada config carga el checkpoint anterior).
#
# VELOCIDAD: 350M es ~4x mas lento que el 88M.
#   - En T4: ~0.05 pasos/s
#   - 5000 pasos = ~28 horas
# Lightning permite runs largos con nohup (sobrevive cierre de navegador).
#
# CORPUS: el mismo consolidado de 882K ejemplos.
#
# Loss esperada al paso 5000: ~2.0
# ════════════════════════════════════════════════════════════════════

fase: c_350m_5k
descripcion: "Modelo C 350M desde cero — 5000 pasos (Lightning)"
modo: sft
seed: 42
device: auto

modelo:
  preset: sota_c    # 350M params

modelo_base: null   # Desde cero (primer escalon)

tokenizer: ml/tokenizer/artefactos/sp_v2_16k.model

corpus:
  jsonl: /tmp/corpus_v2_ampliado.jsonl

training:
  per_device_batch_size: 1
  grad_accum_steps: 16          # batch efectivo 16 (350M no cabe con bs mayor)
  max_pasos: 5000
  epocas: 1
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_ratio: 0.03
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: auto
  gradient_checkpointing: true  # OBLIGATORIO para 350M en T4
  eval_cada: 1000
  save_cada: 500                # checkpoint cada ~7h
  log_cada: 25

salida: training/checkpoints/C_350m_5k
