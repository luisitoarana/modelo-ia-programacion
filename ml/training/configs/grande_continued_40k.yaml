# ════════════════════════════════════════════════════════════════════
# CONTINUED 35K → 40K — Modelo grande 88M, paso 35001 al 40000
#
# Carga checkpoint del 35K y entrena 5000 pasos más. Total: 40000.
# Loss esperada: ~1.3
# EduCodeEval esperado: 42-48 / 100
#
# ESTE ES EL ULTIMO ESCALON DEL PLAN. Modelo "definitivo" del 88M.
# Después de esto: pasar a Reward Models + DPO, o entrenar Modelo C 350M.
# ════════════════════════════════════════════════════════════════════

fase: grande_continued_40k
descripcion: "Continued grande 88M paso 35K→40K — FINAL"
modo: sft
seed: 42
device: auto

modelo:
  preset: sota_grande

modelo_base: /kaggle/working/checkpoints/grande_continued_35k/checkpoint_ultimo.pt

tokenizer: ml/tokenizer/artefactos/sp_v2_16k.model

corpus:
  jsonl: /kaggle/working/corpus_v2.jsonl

training:
  per_device_batch_size: 4
  grad_accum_steps: 4
  max_pasos: 40000
  epocas: 1
  learning_rate: 3.0e-5
  min_learning_rate: 3.0e-6
  warmup_ratio: 0.0
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: auto
  gradient_checkpointing: false
  eval_cada: 500
  save_cada: 250
  log_cada: 25

salida: /kaggle/working/checkpoints/grande_continued_40k
