# ════════════════════════════════════════════════════════════════════
# Modelo GRANDE (88M) — CONTINUED desde checkpoint del 5K, hasta 10K.
#
# Este config se usa en una SEGUNDA corrida (segundo commit de Kaggle)
# despues de que termine el grande_sft_kaggle_5k.yaml.
#
# Reanuda desde:
#   /kaggle/working/checkpoints/grande_sft_5k/checkpoint_ultimo.pt
#
# Y entrena por otros 5000 pasos hasta llegar al paso 10000 total.
#
# Asi cumplimos el objetivo de 10000 pasos del usuario sin el riesgo
# del timeout de 12h en una sola corrida.
# ════════════════════════════════════════════════════════════════════

fase: grande_sft_kaggle_continued
descripcion: "Continued del grande 88M — pasos 5000-10000"
modo: sft
seed: 42
device: auto

modelo:
  preset: sota_grande

# Cargar desde el checkpoint del 5K previo
modelo_base: /kaggle/working/checkpoints/grande_sft_5k/checkpoint_ultimo.pt

tokenizer: ml/tokenizer/artefactos/sp_v2_16k.model

corpus:
  jsonl: /kaggle/working/corpus_v2.jsonl

training:
  per_device_batch_size: 4
  grad_accum_steps: 4
  max_pasos: 10000              # objetivo total acumulado
  epocas: 1
  learning_rate: 1.5e-4         # LR mas bajo en continued
  min_learning_rate: 1.5e-5
  warmup_ratio: 0.0             # sin warmup, ya esta caliente
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: auto
  gradient_checkpointing: false
  eval_cada: 500
  save_cada: 250
  log_cada: 25

salida: /kaggle/working/checkpoints/grande_sft_10k
